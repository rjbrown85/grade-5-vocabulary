<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary quiz | Grade 5E</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="quiz.css">
  <script defer src="words.js"></script>
  <script defer src="definitions.js"></script>
  <script defer src="quiz.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to quiz</a>
<header><a class="home" href="index.html">⌂ Home</a><nav aria-label="Subjects"><a href="reading.html">Reading</a><a href="writing.html">Writing</a><a href="math.html">Math</a></nav></header>
<main id="main">
  <h1>Vocabulary quiz</h1>
  <form id="setup" class="panel">
    <label class="student-name">Your name (optional)<input id="student-name" maxlength="64" autocomplete="off" placeholder="Name for your results"></label>
    <fieldset aria-describedby="mix-hint">
      <legend>Choose your subjects</legend>
      <div class="mix-tools"><p id="mix-hint">Pick one subject or combine them.</p><button type="button" id="all-subjects">Select all subjects</button></div>
      <div class="chips" id="subjects"></div>
    </fieldset>
    <fieldset><legend>Choose your units</legend><div class="chips" id="units"></div></fieldset>
    <div class="settings">
      <label>Questions <select id="length"></select></label>
      <label>Question style <select id="style"><option value="mixed">Mix both styles</option><option value="word">Choose the word</option><option value="definition">Choose the definition</option></select></label>
      <label>Timer <select id="timing"><option value="0">Untimed</option><option value="30">30 seconds per question</option><option value="60">60 seconds per question</option></select></label>
    </div>
    <div class="launch"><div><strong>Your quiz mix</strong><p id="pool" role="status"></p></div>
    <button class="primary" id="start" disabled>Start quiz →</button></div>
  </form>
  <section id="play" class="panel" hidden>
    <div class="status"><span id="progress"></span><span id="clock" role="timer"></span></div>
    <p id="instruction"></p><h2 id="prompt" tabindex="-1"></h2>
    <div id="answers"></div>
    <p id="feedback" role="status"></p><button class="primary" id="next" hidden>Next question →</button>
  </section>
  <section id="results" class="panel" hidden>
    <div id="scorecard" style="font-family:Arial,sans-serif;color:#33261f;background:#fffaf4;border:2px solid #683b27;border-radius:14px;padding:20px;line-height:1.5">
      <strong style="color:#683b27">📚 Grade 5 vocabulary quiz</strong>
      <h2 id="score" tabindex="-1" style="margin:8px 0 0;color:#683b27"></h2>
      <p id="summary" style="margin:2px 0;font-weight:bold"></p>
      <p id="result-name" hidden></p>
      <p id="round-info" style="margin:8px 0"></p>
      <div id="subject-scores"></div>
      <p id="practice-terms" style="margin:12px 0 0"></p>
    </div>
    <div class="result-actions"><button class="primary" id="copy-results">Copy results</button>
    <button id="download-pdf">Download PDF</button>
    <button id="again">Try another quiz</button></div>
    <p id="pdf-status" role="status" hidden></p>
    <p id="copy-status" role="status"></p>
    <textarea id="manual-copy" aria-label="Quiz results to copy" rows="8" readonly hidden></textarea>
    <div id="review"></div>
  </section>
</main>
</body>
</html>
